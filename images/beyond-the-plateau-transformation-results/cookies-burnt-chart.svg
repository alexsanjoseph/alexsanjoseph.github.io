<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">Cookies burned per year</title>
  <desc id="desc">Annual running calories expressed as 250-kilocalorie cookies: 162 in 2021, 285 in 2022, 391 in 2023, and 548 in 2024. Each cookie icon represents 50 cookies, with partial icons for the remainder.</desc>
  <defs>
    <g id="cookie">
      <circle r="14" fill="#DDA65C" stroke="#AD7436" stroke-width="1.2"/>
      <path d="M-9-5 A10 10 0 0 1 4-10" fill="none" stroke="#F7D39B" stroke-width="2" stroke-linecap="round"/>
      <g fill="#68442E"><path d="M-6-7l4-1 2 4-4 2z"/><path d="M4-8l4 2-1 4-4-1z"/><path d="M-1 1l4-1 2 4-4 2z"/><path d="M-9 4l3-1 2 4-3 1z"/><path d="M5 8l3-2 1 3-3 2z"/></g>
      <g fill="#B47A38"><circle cx="-1" cy="-10" r="1"/><circle cx="10" cy="1" r=".8"/><circle cx="-3" cy="10" r=".8"/></g>
    </g>
    <clipPath id="partial-162"><rect x="-16" y="7.28" width="32" height="8"/></clipPath>
    <clipPath id="partial-285"><rect x="-16" y="-5.6" width="32" height="20"/></clipPath>
    <clipPath id="partial-391"><rect x="-16" y="-8.96" width="32" height="24"/></clipPath>
    <clipPath id="partial-548"><rect x="-16" y="-12.88" width="32" height="28"/></clipPath>
    <g id="three"><use href="#cookie"/><use href="#cookie" y="-32"/><use href="#cookie" y="-64"/></g>
    <g id="five"><use href="#three"/><use href="#cookie" y="-96"/><use href="#cookie" y="-128"/></g>
    <g id="seven"><use href="#five"/><use href="#cookie" y="-160"/><use href="#cookie" y="-192"/></g>
    <g id="ten"><use href="#seven"/><use href="#three" y="-224"/></g>
  </defs>
  <rect width="1000" height="660" rx="18" fill="#FBF8F2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="64" fill="#292722" font-size="34" font-weight="700">Cookies burned per year</text>
    <use href="#cookie" x="76" y="100" transform="translate(22.8 30) scale(.7)"/>
    <text x="96" y="106" fill="#716A5E" font-size="16">Each icon = 50 cookies</text>
    <text x="936" y="106" text-anchor="end" fill="#716A5E" font-size="16">1 cookie = 250 kcal</text>
    <path d="M64 135H936" stroke="#E5DED2"/>
    <g transform="translate(200 514)">
      <use href="#three"/>
      <g transform="translate(0 -96)"><circle r="14" fill="#EEE6D8"/><g clip-path="url(#partial-162)"><use href="#cookie"/></g></g>
    </g>
    <g transform="translate(400 514)">
      <use href="#five"/>
      <g transform="translate(0 -160)"><circle r="14" fill="#EEE6D8"/><g clip-path="url(#partial-285)"><use href="#cookie"/></g></g>
    </g>
    <g transform="translate(600 514)">
      <use href="#seven"/>
      <g transform="translate(0 -224)"><circle r="14" fill="#EEE6D8"/><g clip-path="url(#partial-391)"><use href="#cookie"/></g></g>
    </g>
    <g transform="translate(800 514)">
      <use href="#ten"/>
      <g transform="translate(0 -320)"><circle r="14" fill="#EEE6D8"/><g clip-path="url(#partial-548)"><use href="#cookie"/></g></g>
    </g>
    <path d="M120 542H880" stroke="#D8D0C3" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="34" font-weight="700" fill="#292722">
      <text x="200" y="586">162</text><text x="400" y="586">285</text><text x="600" y="586">391</text><text x="800" y="586" fill="#405B49">548</text>
    </g>
    <g text-anchor="middle" font-size="18" fill="#716A5E">
      <text x="200" y="617">2021</text><text x="400" y="617">2022</text><text x="600" y="617">2023</text><text x="800" y="617" fill="#405B49" font-weight="700">2024</text>
    </g>
  </g>
</svg>
